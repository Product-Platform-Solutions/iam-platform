server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /raw/ {
        types { }
        default_type "text/plain; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
