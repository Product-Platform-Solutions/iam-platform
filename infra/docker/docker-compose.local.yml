# Local development stack: Keycloak + the web app. No Traefik / Let's Encrypt / real hostname.
# Run from the repo root:
#   docker compose -f infra/docker/docker-compose.local.yml up
# Then open http://localhost:5173 and sign in as testuser / Test@1234 (you will be asked to set up OTP).
# Keycloak admin console: http://localhost:8080/admin  (admin / admin, local only)
# Local stack runs Keycloak 26.6.1 (passkeys need 26.4+). Production (infra/docker/docker-compose.yml) still
# pins 23.0 until the upgrade is planned. If the tag is not found, try 26.4.0.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: iam-keycloak-local
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../../iam/keycloak/realms:/opt/keycloak/data/import
    # The Keycloak image has no curl, so probe the management port with bash.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: node:22
    container_name: iam-frontend-local
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      # The browser (not the container) talks to Keycloak, so these are host-side addresses.
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: iam-platform
      VITE_KEYCLOAK_CLIENT_ID: iam-web-app
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend/iam-web-app:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  frontend_node_modules:
