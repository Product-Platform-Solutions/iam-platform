name: Project board sync

# Keeps the iam-platform roadmap board (GitHub Projects) in step with issues and PRs.
# Replaces the n8n-based tracker.yml: no server or webhook needed.
#
# Needs one repository secret: PROJECTS_TOKEN, a token that can write to the board
# (classic PAT with the "project" and "repo" scopes, or a fine-grained token with
# Projects: read and write on the organisation).
#
# Status rules
#   issue opened or reopened             -> Backlog
#   push to a branch named feat/<n>-...  -> In progress (issue n)
#   pull request opened or ready         -> In review (issues it closes, or n from the branch)
#   issue closed (e.g. PR with "Closes #n" merged) -> Done
#   manual run (full sync)               -> adds every phase, epic, story and sub-task; sets Backlog where Status
#                                           is empty; copies Start date, Target date, Estimate and Priority from
#                                           .github/roadmap/plan.json (creates those fields if the board lacks them)

on:
  issues:
    types: [opened, reopened, closed]
  push:
    branches: ['feat/**', 'fix/**', 'chore/**']
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/github-script@v7
        env:
          PROJECT_ID: PVT_kwDOD6r-NM4BP_iI
          HAS_TOKEN: ${{ secrets.PROJECTS_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            if (process.env.HAS_TOKEN !== 'true') {
              core.warning('PROJECTS_TOKEN is not set, so the board was not updated.');
              return;
            }
            const projectId = process.env.PROJECT_ID;
            const { owner, repo } = context.repo;

            const fields = await github.graphql(`query($id: ID!) { node(id: $id) { ... on ProjectV2 {
              fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }`,
              { id: projectId });
            const status = fields.node.fields.nodes.find(f => f && f.name === 'Status');
            if (!status) { core.setFailed('No Status field on the board.'); return; }
            const opt = name => {
              const o = status.options.find(x => x.name.toLowerCase().replace(/[^a-z]/g, '') === name);
              if (!o) core.warning(`Status option "${name}" not found on the board.`);
              return o && o.id;
            };

            async function addItem(nodeId) {
              const r = await github.graphql(`mutation($p: ID!, $c: ID!) {
                addProjectV2ItemById(input: { projectId: $p, contentId: $c }) { item { id } } }`, { p: projectId, c: nodeId });
              return r.addProjectV2ItemById.item.id;
            }
            async function setStatus(itemId, key) {
              const optionId = opt(key);
              if (!optionId) return;
              await github.graphql(`mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f,
                  value: { singleSelectOptionId: $o } }) { projectV2Item { id } } }`,
                { p: projectId, i: itemId, f: status.id, o: optionId });
            }
            async function moveIssue(number, key) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
              if (issue.pull_request) return;
              const itemId = await addItem(issue.node_id);
              await setStatus(itemId, key);
              core.info(`#${number} -> ${key}`);
            }
            const fromBranch = ref => {
              const m = /^(?:refs\/heads\/)?(?:feat|fix|chore)\/(\d+)\b/.exec(ref || '');
              return m ? [Number(m[1])] : [];
            };

            const ev = context.eventName, p = context.payload;
            if (ev === 'issues') {
              await moveIssue(p.issue.number, p.action === 'closed' ? 'done' : 'backlog');
            } else if (ev === 'push') {
              for (const n of fromBranch(p.ref)) await moveIssue(n, 'inprogress');
            } else if (ev === 'pull_request') {
              const nums = new Set(fromBranch(p.pull_request.head.ref));
              for (const m of (p.pull_request.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)) nums.add(Number(m[1]));
              for (const n of nums) await moveIssue(n, 'inreview');
            } else if (ev === 'workflow_dispatch') {
              const fs = require('fs');
              const plan = JSON.parse(fs.readFileSync('.github/roadmap/plan.json', 'utf8'));
              const byN = new Map(plan.items.map(x => [x.n, x]));
              const all = await github.graphql(`query($id: ID!) { node(id: $id) { ... on ProjectV2 {
                fields(first: 50) { nodes { __typename ... on ProjectV2FieldCommon { id name dataType }
                  ... on ProjectV2SingleSelectField { options { id name } } } } } } }`, { id: projectId });
              const fieldNodes = all.node.fields.nodes;
              async function ensureField(name, dataType) {
                const f = fieldNodes.find(x => x && x.name === name);
                if (f) return f.id;
                const r = await github.graphql(`mutation($p: ID!, $n: String!, $t: ProjectV2CustomFieldType!) {
                  createProjectV2Field(input: { projectId: $p, name: $n, dataType: $t }) {
                    projectV2Field { ... on ProjectV2Field { id } } } }`, { p: projectId, n: name, t: dataType });
                core.info(`created field ${name}`);
                return r.createProjectV2Field.projectV2Field.id;
              }
              const fStart = await ensureField('Start date', 'DATE');
              const fTarget = await ensureField('Target date', 'DATE');
              const fEst = await ensureField('Estimate', 'NUMBER');
              const prioField = fieldNodes.find(x => x && x.name === 'Priority' && x.options);
              async function setValue(itemId, fieldId, value) {
                await github.graphql(`mutation($p: ID!, $i: ID!, $f: ID!, $v: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f, value: $v }) { projectV2Item { id } } }`,
                  { p: projectId, i: itemId, f: fieldId, v: value });
              }
              const levels = ['type:initiative', 'type:epic', 'type:story', 'type:subtask'];
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const i of issues) {
                if (i.pull_request) continue;
                if (!i.labels.some(l => levels.includes(l.name))) continue;
                const itemId = await addItem(i.node_id);
                const cur = await github.graphql(`query($i: ID!) { node(id: $i) { ... on ProjectV2Item {
                  fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }`, { i: itemId });
                if (!cur.node.fieldValueByName) await setStatus(itemId, 'backlog');
                const p = byN.get(i.number);
                if (p) {
                  await setValue(itemId, fStart, { date: p.start });
                  await setValue(itemId, fTarget, { date: p.target });
                  await setValue(itemId, fEst, { number: p.points });
                  const o = prioField && prioField.options.find(x => x.name.toLowerCase() === p.priority);
                  if (o) await setValue(itemId, prioField.id, { singleSelectOptionId: o.id });
                }
                core.info(`synced #${i.number}`);
              }
            }
