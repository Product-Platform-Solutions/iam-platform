name: Scrum bot

# Keeps the IAM Platform board maintained: status, priority, estimate, dates and sprint on every
# item, velocity-based re-planning, roll-ups, parent auto-close, milestone dates, definition-of-ready
# labels, the board health report, sprint reviews and project status updates.
# Logic lives in .github/scripts/scrum-bot.mjs. Needs the PROJECTS_TOKEN secret.

on:
  issues:
    types: [opened, reopened, closed]
  push:
    branches: ['feat/**', 'fix/**', 'chore/**', develop]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  schedule:
    - cron: '30 20 * * *'   # nightly, 02:00 IST
  workflow_dispatch:

concurrency:
  group: scrum-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scrum bot
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: PVT_kwDOD6r-NM4BP_iI
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::PROJECTS_TOKEN is not set"; exit 0; fi
          node .github/scripts/scrum-bot.mjs
