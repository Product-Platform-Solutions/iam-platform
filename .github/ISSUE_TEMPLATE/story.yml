name: Story
description: A user-facing increment inside an epic
title: "Short outcome in plain words"
labels: ["type:story"]
type: Task
body:
  - type: input
    id: epic
    attributes: { label: Epic, description: "Epic issue number, for example #31" }
    validations: { required: true }
  - type: textarea
    id: story
    attributes: { label: User story, value: "As a ..., I want ..., so that ..." }
    validations: { required: true }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria, value: "- [ ] Given ..., when ..., then ..." }
    validations: { required: true }
  - type: dropdown
    id: points
    attributes: { label: Estimate (story points), options: ["1", "2", "3", "5", "8"] }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: ["Critical", "High", "Medium", "Low"] }
    validations: { required: true }
