name: Epic
description: A feature-sized piece of the roadmap, made of stories
labels: []
type: Epic
body:
  - type: input
    id: parent
    attributes: { label: Parent, description: "Phase (initiative) issue number, for example #28. The bot links the epic and sets its milestone." }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: ["Critical", "High", "Medium", "Low"] }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal and done-when }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Dependencies and risks }
